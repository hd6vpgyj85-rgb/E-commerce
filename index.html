<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yukly Store — Peluches y coleccionables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --black: #0a0a0a;
  --lavender: #c4b5d6;
  --lavender-dark: #9c85b3;
  --gray-100: #f5f5f5;
  --gray-200: #e5e5e5;
  --gray-400: #a3a3a3;
  --gray-600: #525252;
  --danger: #dc2626;
  --whatsapp: #25d366;
  --whatsapp-dark: #1ebc59;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  color: var(--black);
  background: var(--white);
  line-height: 1.5;
}

button, input, select, textarea { font-family: inherit; }

img { display: block; max-width: 100%; }

/* Navbar */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  gap: 16px;
}

.navbar .logo {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--black);
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.navbar .search-wrap {
  flex: 1;
  max-width: 440px;
  margin: 0 24px;
}

.navbar .search-wrap input {
  width: 100%;
  padding: 11px 16px;
  border: 1px solid var(--gray-200);
  font-size: 0.9rem;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
}

.navbar .search-wrap input:focus {
  outline: none;
  border-color: var(--black);
}

.cart-btn {
  position: relative;
  background: var(--black);
  color: var(--white);
  border: none;
  padding: 11px 22px;
  font-size: 0.82rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
}

.cart-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  background: var(--lavender);
  color: var(--black);
  font-size: 0.7rem;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

.cart-badge.hidden { display: none; }

@media (max-width: 640px) {
  .navbar { padding: 12px 16px; gap: 8px; flex-wrap: wrap; }
  .navbar .logo { font-size: 1.1rem; order: 1; }
  .navbar .search-wrap { order: 3; flex-basis: 100%; max-width: none; margin: 4px 0 0; }
  .cart-btn { order: 2; margin-left: auto; padding: 10px 14px; font-size: 0.75rem; }
}

/* Hero */
.hero {
  background: var(--black);
  color: var(--white);
  text-align: center;
  padding: 100px 24px;
}

.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(2.1rem, 6vw, 4rem);
  font-weight: 600;
  line-height: 1.15;
}

.hero h1 em {
  color: var(--lavender);
  font-style: italic;
  font-weight: 500;
}

.hero p {
  font-weight: 300;
  color: var(--gray-400);
  margin-top: 22px;
  font-size: 1.05rem;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

.hero-cta {
  margin-top: 44px;
  background: var(--white);
  color: var(--black);
  border: none;
  padding: 15px 40px;
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

@media (max-width: 640px) {
  .hero { padding: 64px 20px; }
}

/* Tabs */
.tabs-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 22px 32px;
  border-bottom: 1px solid var(--gray-200);
  scrollbar-width: none;
}

.tabs-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  white-space: nowrap;
  background: none;
  border: none;
  padding: 8px 6px;
  font-size: 0.9rem;
  color: var(--gray-600);
  cursor: pointer;
  border-bottom: 2px solid transparent;
}

.tab-btn.active {
  color: var(--black);
  border-bottom-color: var(--black);
  font-weight: 600;
}

@media (max-width: 640px) {
  .tabs-bar { padding: 16px; }
}

/* Filters */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 18px 32px;
  border-bottom: 1px solid var(--gray-200);
}

.filters-bar.hidden { display: none; }

#price-select {
  padding: 9px 14px;
  border: 1px solid var(--gray-200);
  font-size: 0.85rem;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
  background: var(--white);
}

.tag-pill {
  padding: 7px 16px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  font-size: 0.78rem;
  cursor: pointer;
  color: var(--gray-600);
}

.tag-pill.active {
  background: var(--black);
  color: var(--white);
  border-color: var(--black);
}

.clear-filters-btn {
  margin-left: auto;
  background: none;
  border: none;
  text-decoration: underline;
  font-size: 0.78rem;
  color: var(--gray-600);
  cursor: pointer;
}

@media (max-width: 640px) {
  .filters-bar { padding: 14px 16px; }
  .clear-filters-btn { margin-left: 0; }
}

/* Catalog */
.catalog-section { padding: 36px 32px 96px; }

.results-count {
  font-size: 0.85rem;
  color: var(--gray-600);
  margin-bottom: 22px;
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 26px;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--gray-600);
  font-size: 0.95rem;
  grid-column: 1 / -1;
}

@media (max-width: 640px) {
  .catalog-section { padding: 28px 16px 64px; }
}

/* Product card */
.product-card {
  border: 1px solid var(--gray-200);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  background: var(--white);
}

.product-image {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.product-image img { width: 100%; height: 100%; object-fit: cover; }

.product-image .fallback-emoji { font-size: 3rem; }

.stock-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: var(--lavender);
  color: var(--black);
  font-size: 0.7rem;
  padding: 4px 9px;
  font-weight: 600;
}

.sold-out-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 10, 10, 0.62);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: 0.05em;
}

.product-info {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}

.product-collection {
  color: var(--lavender-dark);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}

.product-name { font-family: var(--font-display); font-size: 1.15rem; }

.product-brand { font-size: 0.8rem; color: var(--gray-600); }

.product-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

.product-tags span {
  font-size: 0.7rem;
  background: var(--gray-100);
  padding: 3px 9px;
  color: var(--gray-600);
}

.product-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 12px;
}

.product-price { font-weight: 700; font-size: 1.05rem; }

.add-btn {
  width: 34px;
  height: 34px;
  background: var(--black);
  color: var(--white);
  border: none;
  font-size: 1.25rem;
  line-height: 1;
  cursor: pointer;
}

.add-btn:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }

/* Modals generic */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 10, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 24px;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--white);
  max-width: 860px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  font-size: 1.6rem;
  cursor: pointer;
  z-index: 2;
  line-height: 1;
}

/* Product modal */
.product-modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

@media (max-width: 768px) {
  .product-modal-grid { grid-template-columns: 1fr; }
}

.product-modal-image {
  aspect-ratio: 1 / 1;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.product-modal-image img { width: 100%; height: 100%; object-fit: cover; }

.product-modal-image .fallback-emoji { font-size: 5rem; }

.product-modal-info {
  padding: 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

@media (max-width: 640px) {
  .product-modal-info { padding: 28px 24px; }
}

.product-modal-info .collection-label {
  color: var(--lavender-dark);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}

.product-modal-info h2 { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; }

.product-modal-info .brand { color: var(--gray-600); font-size: 0.9rem; }

.product-modal-info .price { font-size: 1.5rem; font-weight: 700; }

.product-modal-info .stock-line { font-size: 0.85rem; color: var(--gray-600); }

.product-modal-info .description { font-size: 0.92rem; color: var(--gray-600); line-height: 1.6; }

.product-modal-info .product-tags { margin-top: 0; }

.qty-control {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 4px;
}

.qty-control button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  cursor: pointer;
  font-size: 1.1rem;
}

.qty-control span { min-width: 24px; text-align: center; font-weight: 600; }

.add-to-cart-btn {
  margin-top: 12px;
  background: var(--black);
  color: var(--white);
  border: none;
  padding: 16px;
  font-size: 0.9rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}

.add-to-cart-btn:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }

/* Cart drawer */
.cart-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 10, 0.5);
  z-index: 250;
  display: none;
}

.cart-overlay.open { display: block; }

.cart-drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(430px, 100%);
  background: var(--white);
  z-index: 260;
  transform: translateX(100%);
  transition: transform 0.32s ease;
  display: flex;
  flex-direction: column;
}

.cart-drawer.open { transform: translateX(0); }

.cart-header {
  padding: 22px 26px;
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-header h3 { font-family: var(--font-display); font-size: 1.4rem; }

.cart-header button { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

.cart-items { flex: 1; overflow-y: auto; padding: 8px 26px; }

.cart-empty { text-align: center; color: var(--gray-600); padding: 48px 12px; font-size: 0.9rem; }

.cart-item {
  display: flex;
  gap: 14px;
  padding: 18px 0;
  border-bottom: 1px solid var(--gray-200);
}

.cart-item img { width: 68px; height: 68px; object-fit: cover; background: var(--gray-100); }

.cart-item-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }

.cart-item-info .name { font-size: 0.92rem; font-weight: 600; }

.cart-item-info .unit-price { font-size: 0.8rem; color: var(--gray-600); }

.cart-item-qty { display: flex; align-items: center; gap: 10px; }

.cart-item-qty button {
  width: 26px;
  height: 26px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  cursor: pointer;
}

.cart-remove {
  background: none;
  border: none;
  color: var(--gray-600);
  cursor: pointer;
  text-decoration: underline;
  font-size: 0.74rem;
  align-self: flex-start;
  margin-left: auto;
}

.cart-footer { padding: 22px 26px; border-top: 1px solid var(--gray-200); }

.cart-total {
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  margin-bottom: 18px;
  font-size: 1.1rem;
}

.whatsapp-btn {
  width: 100%;
  background: var(--whatsapp);
  color: var(--white);
  border: none;
  padding: 15px;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
}

.whatsapp-btn:hover { background: var(--whatsapp-dark); }

.whatsapp-btn:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }

@media (max-width: 480px) {
  .cart-header, .cart-items, .cart-footer { padding-left: 18px; padding-right: 18px; }
}

/* Checkout modal */
.checkout-body { padding: 40px; display: flex; flex-direction: column; gap: 26px; }

@media (max-width: 640px) {
  .checkout-body { padding: 28px 20px; }
}

.checkout-body h2 { font-family: var(--font-display); font-size: 1.6rem; }

.order-summary { border: 1px solid var(--gray-200); }

.order-summary-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--gray-200);
  font-size: 0.88rem;
}

.order-summary-item:last-of-type { border-bottom: none; }

.order-summary-total {
  display: flex;
  justify-content: space-between;
  padding: 14px 16px;
  font-weight: 700;
  background: var(--gray-100);
}

.checkout-form { display: flex; flex-direction: column; gap: 18px; }

.form-group { display: flex; flex-direction: column; gap: 7px; }

.form-group label { font-size: 0.8rem; font-weight: 600; }

.form-group input,
.form-group textarea {
  border: 1px solid var(--gray-200);
  padding: 11px 14px;
  font-size: 0.9rem;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
  font-family: var(--font-body);
}

.form-group input:focus,
.form-group textarea:focus { outline: none; border-color: var(--black); }

.radio-group { display: flex; gap: 22px; flex-wrap: wrap; }

.radio-option { display: flex; align-items: center; gap: 7px; font-size: 0.87rem; }

.radio-option input { -webkit-appearance: none; appearance: none; width: auto; }

/* Toast */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  background: var(--black);
  color: var(--white);
  padding: 15px 22px;
  font-size: 0.85rem;
  min-width: 220px;
  animation: toast-in 0.3s ease;
}

.toast.error { background: var(--danger); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .toast-container { left: 16px; right: 16px; bottom: 16px; }
  .toast { min-width: 0; }
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">Yukly Store</div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Buscar peluches, coleccionables...">
  </div>
  <button class="cart-btn" id="cart-btn">
    Carrito <span class="cart-badge hidden" id="cart-badge">0</span>
  </button>
</nav>

<header class="hero">
  <h1>Peluches y coleccionables <em>que enamoran</em></h1>
  <p>Piezas exclusivas de tus franquicias favoritas, seleccionadas con cuidado. Pide por WhatsApp, sin complicaciones.</p>
  <button class="hero-cta" id="hero-cta">Ver catálogo</button>
</header>

<div id="catalog">
  <div class="tabs-bar" id="tabs-bar"></div>
  <div class="filters-bar hidden" id="filters-bar">
    <select id="price-select">
      <option value="all">Todos los precios</option>
      <option value="0-200">Hasta $200</option>
      <option value="200-500">$200 – $500</option>
      <option value="500-1000">$500 – $1,000</option>
      <option value="1000-plus">Más de $1,000</option>
    </select>
    <div id="tags-pills" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    <button class="clear-filters-btn" id="clear-filters">Limpiar filtros</button>
  </div>

  <section class="catalog-section">
    <div class="results-count" id="results-count"></div>
    <div class="products-grid" id="products-grid"></div>
  </section>
</div>

<!-- Product modal -->
<div class="modal-overlay" id="product-modal-overlay">
  <div class="modal" id="product-modal">
    <button class="modal-close" id="product-modal-close">&times;</button>
    <div class="product-modal-grid">
      <div class="product-modal-image" id="product-modal-image"></div>
      <div class="product-modal-info">
        <span class="collection-label" id="modal-collection-name"></span>
        <h2 id="modal-product-name"></h2>
        <span class="brand" id="modal-product-brand"></span>
        <span class="price" id="modal-product-price"></span>
        <span class="stock-line" id="modal-product-stock"></span>
        <p class="description" id="modal-product-description"></p>
        <div class="product-tags" id="modal-product-tags"></div>
        <div class="qty-control">
          <button id="modal-qty-minus" type="button">−</button>
          <span id="modal-qty-value">1</span>
          <button id="modal-qty-plus" type="button">+</button>
        </div>
        <button class="add-to-cart-btn" id="modal-add-to-cart">Agregar al carrito</button>
      </div>
    </div>
  </div>
</div>

<!-- Cart drawer -->
<div class="cart-overlay" id="cart-overlay"></div>
<aside class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h3>Tu carrito</h3>
    <button id="cart-close">&times;</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cart-total-value">$0</span>
    </div>
    <button class="whatsapp-btn" id="whatsapp-order-btn">Pedir por WhatsApp</button>
  </div>
</aside>

<!-- Checkout modal -->
<div class="modal-overlay" id="checkout-modal-overlay">
  <div class="modal" id="checkout-modal">
    <button class="modal-close" id="checkout-modal-close">&times;</button>
    <div class="checkout-body">
      <h2>Confirmar pedido</h2>
      <div class="order-summary" id="order-summary"></div>
      <form class="checkout-form" id="checkout-form">
        <div class="form-group">
          <label for="checkout-name">Nombre completo *</label>
          <input type="text" id="checkout-name" required>
        </div>
        <div class="form-group">
          <label for="checkout-phone">Teléfono de contacto *</label>
          <input type="tel" id="checkout-phone" required>
        </div>
        <div class="form-group">
          <label>Entrega</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="delivery" value="Recoger en tienda" checked>
              Recoger en tienda
            </label>
            <label class="radio-option">
              <input type="radio" name="delivery" value="Punto de entrega acordado">
              Punto de entrega acordado
            </label>
          </div>
        </div>
        <div class="form-group">
          <label for="checkout-note">Nota adicional (opcional)</label>
          <textarea id="checkout-note" rows="3"></textarea>
        </div>
        <button type="submit" class="whatsapp-btn" id="checkout-submit">Enviar pedido por WhatsApp</button>
      </form>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE_BUCKET",
  messagingSenderId: "TU_MESSAGING_SENDER_ID",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const WHATSAPP_NUMBER = "526568596503";
const CART_STORAGE_KEY = "yukly-cart";

let collectionsData = [];
let productsData = [];
let cart = loadCart();

const state = {
  search: "",
  activeCollection: "all",
  priceRange: "all",
  activeTags: []
};

const els = {
  searchInput: document.getElementById("search-input"),
  tabsBar: document.getElementById("tabs-bar"),
  filtersBar: document.getElementById("filters-bar"),
  priceSelect: document.getElementById("price-select"),
  tagsPills: document.getElementById("tags-pills"),
  clearFiltersBtn: document.getElementById("clear-filters"),
  resultsCount: document.getElementById("results-count"),
  productsGrid: document.getElementById("products-grid"),
  cartBtn: document.getElementById("cart-btn"),
  cartBadge: document.getElementById("cart-badge"),
  cartOverlay: document.getElementById("cart-overlay"),
  cartDrawer: document.getElementById("cart-drawer"),
  cartClose: document.getElementById("cart-close"),
  cartItems: document.getElementById("cart-items"),
  cartTotalValue: document.getElementById("cart-total-value"),
  whatsappOrderBtn: document.getElementById("whatsapp-order-btn"),
  productModalOverlay: document.getElementById("product-modal-overlay"),
  productModalClose: document.getElementById("product-modal-close"),
  productModalImage: document.getElementById("product-modal-image"),
  modalCollectionName: document.getElementById("modal-collection-name"),
  modalProductName: document.getElementById("modal-product-name"),
  modalProductBrand: document.getElementById("modal-product-brand"),
  modalProductPrice: document.getElementById("modal-product-price"),
  modalProductStock: document.getElementById("modal-product-stock"),
  modalProductDescription: document.getElementById("modal-product-description"),
  modalProductTags: document.getElementById("modal-product-tags"),
  modalQtyValue: document.getElementById("modal-qty-value"),
  modalQtyMinus: document.getElementById("modal-qty-minus"),
  modalQtyPlus: document.getElementById("modal-qty-plus"),
  modalAddToCart: document.getElementById("modal-add-to-cart"),
  checkoutModalOverlay: document.getElementById("checkout-modal-overlay"),
  checkoutModalClose: document.getElementById("checkout-modal-close"),
  orderSummary: document.getElementById("order-summary"),
  checkoutForm: document.getElementById("checkout-form"),
  checkoutName: document.getElementById("checkout-name"),
  checkoutPhone: document.getElementById("checkout-phone"),
  checkoutNote: document.getElementById("checkout-note"),
  toastContainer: document.getElementById("toast-container")
};

let modalProduct = null;
let modalQty = 1;

function loadCart() {
  try {
    const raw = localStorage.getItem(CART_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveCart() {
  localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
}

function formatPrice(n) {
  return "$" + Number(n).toLocaleString("es-MX", { maximumFractionDigits: 0 });
}

function collectionById(id) {
  return collectionsData.find((c) => c.id === id);
}

function imageBlock(url, sizeClass) {
  const wrap = document.createElement("div");
  wrap.className = sizeClass;
  if (url) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = "";
    img.onerror = () => {
      img.remove();
      wrap.innerHTML = '<span class="fallback-emoji">🧸</span>';
    };
    wrap.appendChild(img);
  } else {
    wrap.innerHTML = '<span class="fallback-emoji">🧸</span>';
  }
  return wrap;
}

function renderTabs() {
  els.tabsBar.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "tab-btn" + (state.activeCollection === "all" ? " active" : "");
  allBtn.textContent = "Todos";
  allBtn.onclick = () => { state.activeCollection = "all"; renderTabs(); renderProducts(); };
  els.tabsBar.appendChild(allBtn);

  collectionsData.forEach((c) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (state.activeCollection === c.id ? " active" : "");
    btn.textContent = c.name;
    btn.onclick = () => { state.activeCollection = c.id; renderTabs(); renderProducts(); };
    els.tabsBar.appendChild(btn);
  });
}

function renderTagsPills() {
  const tagSet = new Set();
  productsData.forEach((p) => (p.tags || []).forEach((t) => tagSet.add(t)));
  const tags = Array.from(tagSet);

  if (tags.length === 0) {
    els.filtersBar.classList.add("hidden");
    els.tagsPills.innerHTML = "";
    return;
  }

  els.filtersBar.classList.remove("hidden");
  els.tagsPills.innerHTML = "";
  tags.forEach((tag) => {
    const pill = document.createElement("button");
    pill.type = "button";
    pill.className = "tag-pill" + (state.activeTags.includes(tag) ? " active" : "");
    pill.textContent = tag;
    pill.onclick = () => {
      if (state.activeTags.includes(tag)) {
        state.activeTags = state.activeTags.filter((t) => t !== tag);
      } else {
        state.activeTags.push(tag);
      }
      renderTagsPills();
      renderProducts();
    };
    els.tagsPills.appendChild(pill);
  });
}

function matchesFilters(product) {
  if (state.search) {
    const term = state.search.toLowerCase();
    if (!product.name || !product.name.toLowerCase().includes(term)) return false;
  }
  if (state.activeCollection !== "all" && product.collectionId !== state.activeCollection) return false;
  if (state.priceRange !== "all") {
    const price = Number(product.price) || 0;
    if (state.priceRange === "0-200" && !(price <= 200)) return false;
    if (state.priceRange === "200-500" && !(price > 200 && price <= 500)) return false;
    if (state.priceRange === "500-1000" && !(price > 500 && price <= 1000)) return false;
    if (state.priceRange === "1000-plus" && !(price > 1000)) return false;
  }
  if (state.activeTags.length > 0) {
    const tags = product.tags || [];
    if (!state.activeTags.some((t) => tags.includes(t))) return false;
  }
  return true;
}

function renderProducts() {
  const filtered = productsData.filter(matchesFilters);
  els.resultsCount.textContent = filtered.length + (filtered.length === 1 ? " producto encontrado" : " productos encontrados");
  els.productsGrid.innerHTML = "";

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No encontramos productos con esos filtros.";
    els.productsGrid.appendChild(empty);
    return;
  }

  filtered.forEach((product) => {
    const card = document.createElement("div");
    card.className = "product-card";

    const imgWrap = imageBlock(product.image, "product-image");

    const stock = Number(product.stock) || 0;
    if (stock > 0 && stock <= 5) {
      const badge = document.createElement("span");
      badge.className = "stock-badge";
      badge.textContent = "Últimas " + stock;
      imgWrap.appendChild(badge);
    }
    if (stock === 0) {
      const overlay = document.createElement("div");
      overlay.className = "sold-out-overlay";
      overlay.textContent = "Agotado";
      imgWrap.appendChild(overlay);
    }

    const info = document.createElement("div");
    info.className = "product-info";

    const coll = collectionById(product.collectionId);
    const collName = document.createElement("span");
    collName.className = "product-collection";
    collName.textContent = coll ? coll.name : "";
    info.appendChild(collName);

    const name = document.createElement("h3");
    name.className = "product-name";
    name.textContent = product.name;
    info.appendChild(name);

    if (product.brand) {
      const brand = document.createElement("span");
      brand.className = "product-brand";
      brand.textContent = product.brand;
      info.appendChild(brand);
    }

    if (product.tags && product.tags.length > 0) {
      const tagsWrap = document.createElement("div");
      tagsWrap.className = "product-tags";
      product.tags.slice(0, 3).forEach((t) => {
        const span = document.createElement("span");
        span.textContent = t;
        tagsWrap.appendChild(span);
      });
      info.appendChild(tagsWrap);
    }

    const footer = document.createElement("div");
    footer.className = "product-footer";

    const price = document.createElement("span");
    price.className = "product-price";
    price.textContent = formatPrice(product.price);
    footer.appendChild(price);

    const addBtn = document.createElement("button");
    addBtn.className = "add-btn";
    addBtn.textContent = "+";
    addBtn.disabled = stock === 0;
    addBtn.onclick = (e) => {
      e.stopPropagation();
      addToCart(product, 1);
    };
    footer.appendChild(addBtn);

    info.appendChild(footer);

    card.appendChild(imgWrap);
    card.appendChild(info);

    card.onclick = () => openProductModal(product);

    els.productsGrid.appendChild(card);
  });
}

function openProductModal(product) {
  modalProduct = product;
  modalQty = 1;
  els.modalQtyValue.textContent = modalQty;

  els.productModalImage.innerHTML = "";
  const imgEl = imageBlock(product.image, "");
  while (imgEl.firstChild) els.productModalImage.appendChild(imgEl.firstChild);

  const coll = collectionById(product.collectionId);
  els.modalCollectionName.textContent = coll ? coll.name : "";
  els.modalProductName.textContent = product.name;
  els.modalProductBrand.textContent = product.brand || "";
  els.modalProductPrice.textContent = formatPrice(product.price);

  const stock = Number(product.stock) || 0;
  els.modalProductStock.textContent = stock > 0 ? stock + " disponibles" : "Agotado";
  els.modalProductDescription.textContent = product.description || "";

  els.modalProductTags.innerHTML = "";
  (product.tags || []).forEach((t) => {
    const span = document.createElement("span");
    span.textContent = t;
    els.modalProductTags.appendChild(span);
  });

  els.modalAddToCart.disabled = stock === 0;
  els.modalQtyPlus.disabled = stock === 0;
  els.modalQtyMinus.disabled = stock === 0;

  els.productModalOverlay.classList.add("open");
}

function closeProductModal() {
  els.productModalOverlay.classList.remove("open");
  modalProduct = null;
}

els.modalQtyMinus.onclick = () => {
  if (modalQty > 1) {
    modalQty -= 1;
    els.modalQtyValue.textContent = modalQty;
  }
};

els.modalQtyPlus.onclick = () => {
  if (!modalProduct) return;
  const stock = Number(modalProduct.stock) || 0;
  if (modalQty < stock) {
    modalQty += 1;
    els.modalQtyValue.textContent = modalQty;
  }
};

els.modalAddToCart.onclick = () => {
  if (!modalProduct) return;
  addToCart(modalProduct, modalQty);
  closeProductModal();
};

els.productModalOverlay.addEventListener("click", (e) => {
  if (e.target === els.productModalOverlay) closeProductModal();
});
els.productModalClose.onclick = closeProductModal;

function addToCart(product, qty) {
  const stock = Number(product.stock) || 0;
  const existing = cart.find((i) => i.id === product.id);
  if (existing) {
    existing.qty = Math.min(existing.qty + qty, stock);
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: Number(product.price) || 0,
      image: product.image || "",
      stock: stock,
      qty: Math.min(qty, stock)
    });
  }
  saveCart();
  updateCartUI();
  showToast("Producto agregado al carrito");
}

function updateCartQty(id, qty) {
  const item = cart.find((i) => i.id === id);
  if (!item) return;
  if (qty < 1) qty = 1;
  if (qty > item.stock) qty = item.stock;
  item.qty = qty;
  saveCart();
  updateCartUI();
}

function removeFromCart(id) {
  cart = cart.filter((i) => i.id !== id);
  saveCart();
  updateCartUI();
}

function cartTotal() {
  return cart.reduce((sum, i) => sum + i.price * i.qty, 0);
}

function updateCartUI() {
  const count = cart.reduce((sum, i) => sum + i.qty, 0);
  els.cartBadge.textContent = count;
  els.cartBadge.classList.toggle("hidden", count === 0);

  els.cartItems.innerHTML = "";
  if (cart.length === 0) {
    const empty = document.createElement("div");
    empty.className = "cart-empty";
    empty.textContent = "Tu carrito está vacío.";
    els.cartItems.appendChild(empty);
  } else {
    cart.forEach((item) => {
      const row = document.createElement("div");
      row.className = "cart-item";

      const img = document.createElement("img");
      img.src = item.image || "";
      img.alt = "";
      img.onerror = () => { img.style.background = "var(--gray-100)"; img.src = ""; };
      row.appendChild(img);

      const info = document.createElement("div");
      info.className = "cart-item-info";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      info.appendChild(name);

      const unitPrice = document.createElement("span");
      unitPrice.className = "unit-price";
      unitPrice.textContent = formatPrice(item.price) + " c/u";
      info.appendChild(unitPrice);

      const qtyWrap = document.createElement("div");
      qtyWrap.className = "cart-item-qty";

      const minus = document.createElement("button");
      minus.textContent = "−";
      minus.onclick = () => updateCartQty(item.id, item.qty - 1);
      qtyWrap.appendChild(minus);

      const qtySpan = document.createElement("span");
      qtySpan.textContent = item.qty;
      qtyWrap.appendChild(qtySpan);

      const plus = document.createElement("button");
      plus.textContent = "+";
      plus.onclick = () => updateCartQty(item.id, item.qty + 1);
      qtyWrap.appendChild(plus);

      info.appendChild(qtyWrap);

      const removeBtn = document.createElement("button");
      removeBtn.className = "cart-remove";
      removeBtn.textContent = "Eliminar";
      removeBtn.onclick = () => removeFromCart(item.id);
      info.appendChild(removeBtn);

      row.appendChild(info);
      els.cartItems.appendChild(row);
    });
  }

  els.cartTotalValue.textContent = formatPrice(cartTotal());
  els.whatsappOrderBtn.disabled = cart.length === 0;
}

function openCart() {
  els.cartOverlay.classList.add("open");
  els.cartDrawer.classList.add("open");
}

function closeCart() {
  els.cartOverlay.classList.remove("open");
  els.cartDrawer.classList.remove("open");
}

els.cartBtn.onclick = openCart;
els.cartClose.onclick = closeCart;
els.cartOverlay.onclick = closeCart;

function openCheckoutModal() {
  if (cart.length === 0) return;
  els.orderSummary.innerHTML = "";
  cart.forEach((item) => {
    const row = document.createElement("div");
    row.className = "order-summary-item";
    row.innerHTML = "<span>" + item.name + " ×" + item.qty + "</span><span>" + formatPrice(item.price * item.qty) + "</span>";
    els.orderSummary.appendChild(row);
  });
  const totalRow = document.createElement("div");
  totalRow.className = "order-summary-total";
  totalRow.innerHTML = "<span>Total</span><span>" + formatPrice(cartTotal()) + "</span>";
  els.orderSummary.appendChild(totalRow);

  els.checkoutModalOverlay.classList.add("open");
}

function closeCheckoutModal() {
  els.checkoutModalOverlay.classList.remove("open");
}

els.whatsappOrderBtn.onclick = () => {
  closeCart();
  openCheckoutModal();
};

els.checkoutModalClose.onclick = closeCheckoutModal;
els.checkoutModalOverlay.addEventListener("click", (e) => {
  if (e.target === els.checkoutModalOverlay) closeCheckoutModal();
});

els.checkoutForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const name = els.checkoutName.value.trim();
  const phone = els.checkoutPhone.value.trim();
  const delivery = els.checkoutForm.querySelector('input[name="delivery"]:checked').value;
  const note = els.checkoutNote.value.trim();

  if (!name || !phone) return;

  let message = "*Nuevo pedido — Yukly Store*\n\n";
  message += "*Cliente:* " + name + "\n";
  message += "*Teléfono:* " + phone + "\n";
  message += "*Entrega:* " + delivery + "\n\n";
  message += "*Productos:*\n";
  cart.forEach((item) => {
    message += "• " + item.name + " ×" + item.qty + " — " + formatPrice(item.price * item.qty) + "\n";
  });
  message += "\n*Total: " + formatPrice(cartTotal()) + " MXN*";
  if (note) {
    message += "\n\n*Nota:* " + note;
  }

  window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message), "_blank");

  cart = [];
  saveCart();
  updateCartUI();
  closeCheckoutModal();
  closeCart();
  els.checkoutForm.reset();
  showToast("¡Pedido enviado!");
});

function showToast(msg, type) {
  const toast = document.createElement("div");
  toast.className = "toast" + (type === "error" ? " error" : "");
  toast.textContent = msg;
  els.toastContainer.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

els.searchInput.addEventListener("input", (e) => {
  state.search = e.target.value;
  renderProducts();
});

els.priceSelect.addEventListener("change", (e) => {
  state.priceRange = e.target.value;
  renderProducts();
});

els.clearFiltersBtn.onclick = () => {
  state.search = "";
  state.activeCollection = "all";
  state.priceRange = "all";
  state.activeTags = [];
  els.searchInput.value = "";
  els.priceSelect.value = "all";
  renderTabs();
  renderTagsPills();
  renderProducts();
};

document.getElementById("hero-cta").onclick = () => {
  document.getElementById("catalog").scrollIntoView({ behavior: "smooth" });
};

onSnapshot(collection(db, "collections"), (snap) => {
  collectionsData = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  renderTabs();
  renderProducts();
});

onSnapshot(collection(db, "products"), (snap) => {
  productsData = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  renderTagsPills();
  renderProducts();
});

updateCartUI();
</script>
</body>
</html>
