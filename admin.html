<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel administrativo — Yukly Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff;
  --black:#0a0a0a;
  --lavender:#c4b5d6;
  --lavender-light:#f3eef8;
  --gray-100:#f6f6f6;
  --gray-200:#e8e8e8;
  --gray-300:#d4d4d4;
  --gray-500:#8a8a8a;
  --gray-700:#4a4a4a;
  --green:#2e7d4f;
  --green-bg:#e8f5ee;
  --amber:#a3720a;
  --amber-bg:#fdf3e0;
  --red:#c0392b;
  --red-bg:#fbeceb;
  --font-display:'Playfair Display', serif;
  --font-body:'Inter', sans-serif;
  --sidebar-width:240px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--black);
  background:var(--gray-100);
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:1rem;-webkit-appearance:none;appearance:none;border-radius:0;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}

.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:var(--sidebar-width);
  background:var(--black);
  color:var(--white);
  display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;
  transform:translateX(-100%);
  transition:transform 0.25s ease;
  z-index:300;
}
.sidebar.open{transform:translateX(0);}
.sidebar-logo{
  font-family:var(--font-display);
  font-weight:700;font-size:1.3rem;
  padding:26px 24px;
  border-bottom:1px solid rgba(255,255,255,0.12);
}
.sidebar-nav{flex:1;padding:16px 0;}
.sidebar-link{
  display:block;width:100%;text-align:left;
  padding:14px 24px;
  font-size:0.9rem;font-weight:500;
  color:rgba(255,255,255,0.65);
  border-left:3px solid transparent;
}
.sidebar-link.active{
  color:var(--white);font-weight:600;
  border-left-color:var(--lavender);
  background:rgba(255,255,255,0.05);
}
.sidebar-logout{
  padding:18px 24px;
  border-top:1px solid rgba(255,255,255,0.12);
  font-size:0.85rem;font-weight:600;
  color:rgba(255,255,255,0.75);
  text-align:left;
}
.sidebar-logout:hover{color:var(--white);}

.sidebar-overlay{
  position:fixed;inset:0;background:rgba(10,10,10,0.5);
  z-index:290;display:none;
}
.sidebar-overlay.open{display:block;}

@media (min-width:960px){
  .sidebar{transform:translateX(0);position:fixed;}
  .sidebar-overlay{display:none !important;}
}

/* Main */
.main{
  flex:1;
  min-width:0;
  width:100%;
}
@media (min-width:960px){
  .main{margin-left:var(--sidebar-width);}
}

.topbar{
  position:sticky;top:0;z-index:80;
  background:var(--white);
  border-bottom:1px solid var(--gray-200);
  padding:16px 24px;
  display:flex;align-items:center;gap:16px;
}
.hamburger{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
}
@media (min-width:960px){
  .hamburger{display:none;}
}
.topbar-title{
  font-family:var(--font-display);
  font-weight:600;font-size:1.2rem;
  flex:1;
}
.view-store-link{
  font-size:0.85rem;font-weight:600;
  color:var(--gray-700);
  white-space:nowrap;
}
.view-store-link:hover{color:var(--black);}

.content{padding:24px;}

.section-header{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;
  margin-bottom:22px;
}
.section-header h2{font-family:var(--font-display);font-weight:600;font-size:1.4rem;}
.btn-primary{
  background:var(--black);color:var(--white);
  padding:11px 20px;font-weight:600;font-size:0.85rem;
  white-space:nowrap;
}
.btn-primary:hover{background:#222;}

/* Stat cards */
.stats-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:14px;margin-bottom:28px;
}
@media (min-width:700px){
  .stats-grid{grid-template-columns:repeat(4,1fr);}
}
.stat-card{
  background:var(--white);
  border:1px solid var(--gray-200);
  padding:18px;
}
.stat-value{font-family:var(--font-display);font-weight:700;font-size:1.8rem;}
.stat-label{font-size:0.78rem;color:var(--gray-500);margin-top:4px;}

/* Table */
.table-wrap{
  background:var(--white);
  border:1px solid var(--gray-200);
  overflow-x:auto;
}
table{width:100%;border-collapse:collapse;min-width:820px;}
th,td{
  text-align:left;padding:12px 14px;
  font-size:0.85rem;
  border-bottom:1px solid var(--gray-100);
  white-space:nowrap;
}
th{
  font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;
  color:var(--gray-500);font-weight:600;
  background:var(--gray-100);
}
tbody tr:hover{background:var(--gray-100);}
@media (max-width:760px){
  th:nth-child(1), td:nth-child(1){display:none;}
  th:nth-child(3), td:nth-child(3){display:none;}
  th:nth-child(4), td:nth-child(4){display:none;}
  th:nth-child(6), td:nth-child(6){display:none;}
  th:nth-child(7), td:nth-child(7){display:none;}
}
.cell-img{
  position:relative;width:44px;height:44px;
  background:var(--lavender-light);
}
.cell-img .img-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.cell-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.cell-tags{display:flex;flex-wrap:wrap;gap:4px;max-width:160px;white-space:normal;}
.mini-tag{font-size:0.68rem;border:1px solid var(--gray-200);padding:2px 6px;}
.stock-control{display:flex;align-items:center;gap:8px;}
.stock-control button{
  width:24px;height:24px;border:1px solid var(--gray-300);font-size:0.9rem;
  display:flex;align-items:center;justify-content:center;
}
.stock-control button:disabled{color:var(--gray-300);cursor:not-allowed;}
.badge{
  display:inline-block;font-size:0.72rem;font-weight:600;
  padding:4px 10px;
}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-red{background:var(--red-bg);color:var(--red);}
.row-actions{display:flex;gap:10px;}
.link-btn{font-size:0.8rem;font-weight:600;color:var(--gray-700);}
.link-btn:hover{color:var(--black);}
.link-btn.danger{color:var(--red);}

/* Collections grid */
.collections-grid{
  display:grid;grid-template-columns:1fr;
  gap:16px;
}
@media (min-width:640px){
  .collections-grid{grid-template-columns:repeat(2,1fr);}
}
@media (min-width:960px){
  .collections-grid{grid-template-columns:repeat(3,1fr);}
}
.collection-card{
  background:var(--white);
  border:1px solid var(--gray-200);
  padding:18px;
  display:flex;flex-direction:column;gap:6px;
}
.collection-card-name{font-family:var(--font-display);font-weight:600;font-size:1.1rem;}
.collection-card-count{font-size:0.82rem;color:var(--gray-500);}
.collection-card-actions{
  display:flex;gap:14px;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--gray-100);
}

.hidden-section{display:none;}

/* Modals */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,10,10,0.55);
  z-index:400;display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--white);
  width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  padding:26px;position:relative;
}
.modal h2{font-family:var(--font-display);font-weight:600;font-size:1.3rem;margin-bottom:20px;}
.modal-close{position:absolute;top:18px;right:18px;width:32px;height:32px;font-size:1.2rem;}
.modal-grid{
  display:grid;grid-template-columns:1fr;gap:14px;
}
@media (min-width:560px){
  .modal-grid{grid-template-columns:1fr 1fr;}
}
.field-full{grid-column:1/-1;}
.form-group label{
  display:block;font-size:0.78rem;font-weight:600;margin-bottom:6px;
}
.form-group input,.form-group select,.form-group textarea{
  width:100%;border:1px solid var(--gray-300);padding:10px 12px;font-size:0.88rem;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--black);}
.image-preview{
  margin-top:10px;width:100%;aspect-ratio:16/9;
  background:var(--lavender-light);
  position:relative;overflow:hidden;
  display:none;
}
.image-preview.show{display:block;}
.image-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.modal-submit{
  width:100%;background:var(--black);color:var(--white);
  padding:14px;font-weight:600;font-size:0.88rem;
  margin-top:22px;
}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:500;
  padding:14px 22px;font-size:0.88rem;font-weight:500;color:var(--white);
  background:var(--black);
  transform:translateY(120%);opacity:0;
  transition:transform 0.25s ease,opacity 0.25s ease;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{background:var(--red);}

@media (max-width:520px){
  .modal{padding:18px;}
  .content{padding:16px;}
}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Yukly Store</div>
    <nav class="sidebar-nav">
      <button class="sidebar-link active" data-section="products">Productos</button>
      <button class="sidebar-link" data-section="collections">Colecciones</button>
    </nav>
    <button class="sidebar-logout" id="logoutBtn">Cerrar sesión</button>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menú">&#9776;</button>
      <h1 class="topbar-title" id="topbarTitle">Productos</h1>
      <a href="index.html" target="_blank" class="view-store-link">Ver tienda &rarr;</a>
    </div>

    <div class="content">
      <section id="productsSection">
        <div class="section-header">
          <h2>Productos</h2>
          <button class="btn-primary" id="newProductBtn">+ Nuevo producto</button>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="statTotalProducts">0</div>
            <div class="stat-label">Total de productos</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statTotalCollections">0</div>
            <div class="stat-label">Total de colecciones</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statSoldOut">0</div>
            <div class="stat-label">Productos agotados</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statLowStock">0</div>
            <div class="stat-label">Stock bajo</div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Colección</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Marca</th>
                <th>Etiquetas</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="productsTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="collectionsSection" class="hidden-section">
        <div class="section-header">
          <h2>Colecciones</h2>
          <button class="btn-primary" id="newCollectionBtn">+ Nueva colección</button>
        </div>
        <div class="collections-grid" id="collectionsGrid"></div>
      </section>
    </div>
  </div>
</div>

<!-- Product modal -->
<div class="modal-overlay" id="productModalOverlay">
  <div class="modal">
    <button class="modal-close" id="productModalClose">&times;</button>
    <h2 id="productModalTitle">Nuevo producto</h2>
    <form id="productForm">
      <div class="modal-grid">
        <div class="form-group field-full">
          <label for="pName">Nombre *</label>
          <input type="text" id="pName" required>
        </div>
        <div class="form-group">
          <label for="pPrice">Precio (MXN) *</label>
          <input type="number" id="pPrice" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="pStock">Stock *</label>
          <input type="number" id="pStock" min="0" step="1" required>
        </div>
        <div class="form-group">
          <label for="pCollection">Colección *</label>
          <select id="pCollection" required></select>
        </div>
        <div class="form-group">
          <label for="pBrand">Marca</label>
          <input type="text" id="pBrand">
        </div>
        <div class="form-group field-full">
          <label for="pTags">Etiquetas (separadas por coma)</label>
          <input type="text" id="pTags" placeholder="anime, kawaii, edición limitada">
        </div>
        <div class="form-group field-full">
          <label for="pDescription">Descripción</label>
          <textarea id="pDescription" rows="3"></textarea>
        </div>
        <div class="form-group field-full">
          <label for="pImage">URL de imagen</label>
          <input type="url" id="pImage" placeholder="https://...">
          <div class="image-preview" id="pImagePreview"><img id="pImagePreviewImg" alt=""></div>
        </div>
      </div>
      <button type="submit" class="modal-submit">Guardar producto</button>
    </form>
  </div>
</div>

<!-- Collection modal -->
<div class="modal-overlay" id="collectionModalOverlay">
  <div class="modal">
    <button class="modal-close" id="collectionModalClose">&times;</button>
    <h2 id="collectionModalTitle">Nueva colección</h2>
    <form id="collectionForm">
      <div class="form-group" style="margin-bottom:14px;">
        <label for="cName">Nombre *</label>
        <input type="text" id="cName" required>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label for="cDescription">Descripción</label>
        <textarea id="cDescription" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="cImage">URL de imagen de portada</label>
        <input type="url" id="cImage" placeholder="https://...">
        <div class="image-preview" id="cImagePreview"><img id="cImagePreviewImg" alt=""></div>
      </div>
      <button type="submit" class="modal-submit">Guardar colección</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc,
  serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAa-LNMZC9xqzUO8lpcVDnNC_Mhf72BFE4",
  authDomain: "e-commer-87036.firebaseapp.com",
  projectId: "e-commer-87036",
  storageBucket: "e-commer-87036.firebasestorage.app",
  messagingSenderId: "820920218503",
  appId: "1:820920218503:web:97d3f10b6041d2f0c89922"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, user => {
  if(!user){
    window.location.href = "admin-login.html";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "admin-login.html";
});

/* ---------- State ---------- */

let collections = [];
let products = [];
let editingProductId = null;
let editingCollectionId = null;

const el = {
  sidebar: document.getElementById("sidebar"),
  sidebarOverlay: document.getElementById("sidebarOverlay"),
  hamburgerBtn: document.getElementById("hamburgerBtn"),
  topbarTitle: document.getElementById("topbarTitle"),
  productsSection: document.getElementById("productsSection"),
  collectionsSection: document.getElementById("collectionsSection"),
  statTotalProducts: document.getElementById("statTotalProducts"),
  statTotalCollections: document.getElementById("statTotalCollections"),
  statSoldOut: document.getElementById("statSoldOut"),
  statLowStock: document.getElementById("statLowStock"),
  productsTableBody: document.getElementById("productsTableBody"),
  collectionsGrid: document.getElementById("collectionsGrid"),
  newProductBtn: document.getElementById("newProductBtn"),
  newCollectionBtn: document.getElementById("newCollectionBtn"),
  productModalOverlay: document.getElementById("productModalOverlay"),
  productModalTitle: document.getElementById("productModalTitle"),
  productModalClose: document.getElementById("productModalClose"),
  productForm: document.getElementById("productForm"),
  pName: document.getElementById("pName"),
  pPrice: document.getElementById("pPrice"),
  pStock: document.getElementById("pStock"),
  pCollection: document.getElementById("pCollection"),
  pBrand: document.getElementById("pBrand"),
  pTags: document.getElementById("pTags"),
  pDescription: document.getElementById("pDescription"),
  pImage: document.getElementById("pImage"),
  pImagePreview: document.getElementById("pImagePreview"),
  pImagePreviewImg: document.getElementById("pImagePreviewImg"),
  collectionModalOverlay: document.getElementById("collectionModalOverlay"),
  collectionModalTitle: document.getElementById("collectionModalTitle"),
  collectionModalClose: document.getElementById("collectionModalClose"),
  collectionForm: document.getElementById("collectionForm"),
  cName: document.getElementById("cName"),
  cDescription: document.getElementById("cDescription"),
  cImage: document.getElementById("cImage"),
  cImagePreview: document.getElementById("cImagePreview"),
  cImagePreviewImg: document.getElementById("cImagePreviewImg"),
  toast: document.getElementById("toast")
};

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function formatPrice(n){
  return "$" + Number(n).toLocaleString("es-MX", { maximumFractionDigits: 2 });
}

function showToast(msg, isError){
  el.toast.textContent = msg;
  el.toast.classList.toggle("error", !!isError);
  el.toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.toast.classList.remove("show"), 3000);
}

function imageBlock(imageUrl, altText, emoji){
  const safeAlt = escapeHtml(altText);
  const img = imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${safeAlt}" loading="lazy" onerror="this.onerror=null;this.remove();">` : "";
  return `<span class="img-fallback">${emoji}</span>${img}`;
}

function collectionName(id){
  const c = collections.find(c => c.id === id);
  return c ? c.name : "—";
}

/* ---------- Navigation ---------- */

document.querySelectorAll(".sidebar-link").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".sidebar-link").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const section = btn.dataset.section;
    el.topbarTitle.textContent = section === "products" ? "Productos" : "Colecciones";
    el.productsSection.classList.toggle("hidden-section", section !== "products");
    el.collectionsSection.classList.toggle("hidden-section", section !== "collections");
    closeSidebar();
  });
});

function openSidebar(){
  el.sidebar.classList.add("open");
  el.sidebarOverlay.classList.add("open");
}
function closeSidebar(){
  el.sidebar.classList.remove("open");
  el.sidebarOverlay.classList.remove("open");
}
el.hamburgerBtn.addEventListener("click", openSidebar);
el.sidebarOverlay.addEventListener("click", closeSidebar);

/* ---------- Firestore listeners ---------- */

onSnapshot(query(collection(db, "collections"), orderBy("name")), snap => {
  collections = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderCollectionSelect();
  renderCollectionsGrid();
  renderStats();
});

onSnapshot(collection(db, "products"), snap => {
  products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderProductsTable();
  renderCollectionsGrid();
  renderStats();
});

/* ---------- Stats ---------- */

function renderStats(){
  el.statTotalProducts.textContent = products.length;
  el.statTotalCollections.textContent = collections.length;
  el.statSoldOut.textContent = products.filter(p => (Number(p.stock) || 0) === 0).length;
  el.statLowStock.textContent = products.filter(p => {
    const s = Number(p.stock) || 0;
    return s > 0 && s <= 5;
  }).length;
}

/* ---------- Products table ---------- */

function stockBadge(stock){
  if(stock === 0) return `<span class="badge badge-red">Agotado</span>`;
  if(stock <= 5) return `<span class="badge badge-amber">Stock bajo</span>`;
  return `<span class="badge badge-green">Disponible</span>`;
}

function renderProductsTable(){
  if(products.length === 0){
    el.productsTableBody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--gray-500);padding:30px;">No hay productos registrados.</td></tr>`;
    return;
  }

  el.productsTableBody.innerHTML = products.map(p => {
    const stock = Number(p.stock) || 0;
    const tags = p.tags || [];
    return `
      <tr data-id="${p.id}">
        <td><div class="cell-img">${imageBlock(p.image, p.name, "📦")}</div></td>
        <td>${escapeHtml(p.name)}</td>
        <td>${escapeHtml(collectionName(p.collectionId))}</td>
        <td>${formatPrice(p.price)}</td>
        <td>
          <div class="stock-control">
            <button class="stock-minus" data-id="${p.id}" ${stock <= 0 ? "disabled" : ""}>−</button>
            <span>${stock}</span>
            <button class="stock-plus" data-id="${p.id}">+</button>
          </div>
        </td>
        <td>${escapeHtml(p.brand || "—")}</td>
        <td><div class="cell-tags">${tags.map(t => `<span class="mini-tag">${escapeHtml(t)}</span>`).join("")}</div></td>
        <td>${stockBadge(stock)}</td>
        <td>
          <div class="row-actions">
            <button class="link-btn edit-product" data-id="${p.id}">Editar</button>
            <button class="link-btn danger delete-product" data-id="${p.id}">Eliminar</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");

  el.productsTableBody.querySelectorAll(".stock-minus").forEach(btn => {
    btn.addEventListener("click", () => adjustStock(btn.dataset.id, -1));
  });
  el.productsTableBody.querySelectorAll(".stock-plus").forEach(btn => {
    btn.addEventListener("click", () => adjustStock(btn.dataset.id, 1));
  });
  el.productsTableBody.querySelectorAll(".edit-product").forEach(btn => {
    btn.addEventListener("click", () => openProductModal(btn.dataset.id));
  });
  el.productsTableBody.querySelectorAll(".delete-product").forEach(btn => {
    btn.addEventListener("click", () => deleteProduct(btn.dataset.id));
  });
}

async function adjustStock(id, delta){
  const p = products.find(p => p.id === id);
  if(!p) return;
  const newStock = Math.max(0, (Number(p.stock) || 0) + delta);
  try{
    await updateDoc(doc(db, "products", id), { stock: newStock });
  }catch(e){
    showToast("Error al actualizar el stock", true);
  }
}

async function deleteProduct(id){
  if(!confirm("¿Eliminar este producto? Esta acción no se puede deshacer.")) return;
  try{
    await deleteDoc(doc(db, "products", id));
    showToast("Producto eliminado");
  }catch(e){
    showToast("Error al eliminar el producto", true);
  }
}

/* ---------- Collections grid ---------- */

function renderCollectionsGrid(){
  if(collections.length === 0){
    el.collectionsGrid.innerHTML = `<div style="color:var(--gray-500);padding:30px;">No hay colecciones registradas.</div>`;
    return;
  }

  el.collectionsGrid.innerHTML = collections.map(c => {
    const count = products.filter(p => p.collectionId === c.id).length;
    return `
      <div class="collection-card" data-id="${c.id}">
        <span class="collection-card-name">${escapeHtml(c.name)}</span>
        <span class="collection-card-count">${count} producto${count === 1 ? "" : "s"} asignado${count === 1 ? "" : "s"}</span>
        <div class="collection-card-actions">
          <button class="link-btn edit-collection" data-id="${c.id}">Editar</button>
          <button class="link-btn danger delete-collection" data-id="${c.id}">Eliminar</button>
        </div>
      </div>
    `;
  }).join("");

  el.collectionsGrid.querySelectorAll(".edit-collection").forEach(btn => {
    btn.addEventListener("click", () => openCollectionModal(btn.dataset.id));
  });
  el.collectionsGrid.querySelectorAll(".delete-collection").forEach(btn => {
    btn.addEventListener("click", () => deleteCollection(btn.dataset.id));
  });
}

async function deleteCollection(id){
  const count = products.filter(p => p.collectionId === id).length;
  if(count > 0){
    showToast("No puedes eliminar una colección con productos asignados", true);
    return;
  }
  if(!confirm("¿Eliminar esta colección? Esta acción no se puede deshacer.")) return;
  try{
    await deleteDoc(doc(db, "collections", id));
    showToast("Colección eliminada");
  }catch(e){
    showToast("Error al eliminar la colección", true);
  }
}

/* ---------- Product modal ---------- */

function renderCollectionSelect(){
  const current = el.pCollection.value;
  el.pCollection.innerHTML = `<option value="" disabled ${!current ? "selected" : ""}>Selecciona una colección</option>` +
    collections.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
  if(current && collections.some(c => c.id === current)){
    el.pCollection.value = current;
  }
}

function openProductModal(id){
  editingProductId = id || null;
  el.productForm.reset();
  el.pImagePreview.classList.remove("show");
  renderCollectionSelect();

  if(id){
    const p = products.find(p => p.id === id);
    if(!p) return;
    el.productModalTitle.textContent = "Editar producto";
    el.pName.value = p.name || "";
    el.pPrice.value = p.price ?? "";
    el.pStock.value = p.stock ?? "";
    el.pCollection.value = p.collectionId || "";
    el.pBrand.value = p.brand || "";
    el.pTags.value = (p.tags || []).join(", ");
    el.pDescription.value = p.description || "";
    el.pImage.value = p.image || "";
    if(p.image){
      el.pImagePreviewImg.src = p.image;
      el.pImagePreview.classList.add("show");
    }
  }else{
    el.productModalTitle.textContent = "Nuevo producto";
  }

  el.productModalOverlay.classList.add("open");
}

function closeProductModal(){
  el.productModalOverlay.classList.remove("open");
  editingProductId = null;
}

el.newProductBtn.addEventListener("click", () => openProductModal(null));
el.productModalClose.addEventListener("click", closeProductModal);
el.productModalOverlay.addEventListener("click", e => {
  if(e.target === el.productModalOverlay) closeProductModal();
});

el.pImage.addEventListener("input", () => {
  const url = el.pImage.value.trim();
  if(url){
    el.pImagePreviewImg.src = url;
    el.pImagePreview.classList.add("show");
  }else{
    el.pImagePreview.classList.remove("show");
  }
});

el.productForm.addEventListener("submit", async e => {
  e.preventDefault();

  const tags = el.pTags.value.split(",").map(t => t.trim()).filter(Boolean);

  const data = {
    name: el.pName.value.trim(),
    price: parseFloat(el.pPrice.value) || 0,
    stock: parseInt(el.pStock.value, 10) || 0,
    collectionId: el.pCollection.value,
    brand: el.pBrand.value.trim(),
    tags,
    description: el.pDescription.value.trim(),
    image: el.pImage.value.trim()
  };

  try{
    if(editingProductId){
      await updateDoc(doc(db, "products", editingProductId), data);
      showToast("Producto actualizado");
    }else{
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "products"), data);
      showToast("Producto creado");
    }
    closeProductModal();
  }catch(err){
    showToast("Error al guardar el producto", true);
  }
});

/* ---------- Collection modal ---------- */

function openCollectionModal(id){
  editingCollectionId = id || null;
  el.collectionForm.reset();
  el.cImagePreview.classList.remove("show");

  if(id){
    const c = collections.find(c => c.id === id);
    if(!c) return;
    el.collectionModalTitle.textContent = "Editar colección";
    el.cName.value = c.name || "";
    el.cDescription.value = c.description || "";
    el.cImage.value = c.image || "";
    if(c.image){
      el.cImagePreviewImg.src = c.image;
      el.cImagePreview.classList.add("show");
    }
  }else{
    el.collectionModalTitle.textContent = "Nueva colección";
  }

  el.collectionModalOverlay.classList.add("open");
}

function closeCollectionModal(){
  el.collectionModalOverlay.classList.remove("open");
  editingCollectionId = null;
}

el.newCollectionBtn.addEventListener("click", () => openCollectionModal(null));
el.collectionModalClose.addEventListener("click", closeCollectionModal);
el.collectionModalOverlay.addEventListener("click", e => {
  if(e.target === el.collectionModalOverlay) closeCollectionModal();
});

el.cImage.addEventListener("input", () => {
  const url = el.cImage.value.trim();
  if(url){
    el.cImagePreviewImg.src = url;
    el.cImagePreview.classList.add("show");
  }else{
    el.cImagePreview.classList.remove("show");
  }
});

el.collectionForm.addEventListener("submit", async e => {
  e.preventDefault();

  const data = {
    name: el.cName.value.trim(),
    description: el.cDescription.value.trim(),
    image: el.cImage.value.trim()
  };

  try{
    if(editingCollectionId){
      await updateDoc(doc(db, "collections", editingCollectionId), data);
      showToast("Colección actualizada");
    }else{
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "collections"), data);
      showToast("Colección creada");
    }
    closeCollectionModal();
  }catch(err){
    showToast("Error al guardar la colección", true);
  }
});
</script>
</body>
</html>
