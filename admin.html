<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yukly Store — Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --black: #0a0a0a;
  --lavender: #c4b5d6;
  --lavender-dark: #9c85b3;
  --gray-100: #f5f5f5;
  --gray-200: #e5e5e5;
  --gray-400: #a3a3a3;
  --gray-600: #525252;
  --success: #15803d;
  --success-bg: #dcfce7;
  --warning: #a16207;
  --warning-bg: #fef9c3;
  --danger: #b91c1c;
  --danger-bg: #fee2e2;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --sidebar-width: 240px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  color: var(--black);
  background: var(--gray-100);
  min-height: 100vh;
}

button, input, select, textarea { font-family: inherit; }

img { display: block; max-width: 100%; }

.app-layout { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-width);
  background: var(--black);
  color: var(--white);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 300;
  transition: transform 0.28s ease;
}

.sidebar-logo {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 700;
  padding: 26px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.sidebar-nav { flex: 1; padding: 16px 0; }

.sidebar-nav-item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  padding: 14px 24px;
  font-size: 0.92rem;
  cursor: pointer;
  border-left: 3px solid transparent;
}

.sidebar-nav-item.active {
  color: var(--white);
  background: rgba(255,255,255,0.06);
  border-left-color: var(--lavender);
  font-weight: 600;
}

.sidebar-footer { padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.12); }

.logout-btn {
  width: 100%;
  background: none;
  border: 1px solid rgba(255,255,255,0.3);
  color: var(--white);
  padding: 11px;
  font-size: 0.85rem;
  cursor: pointer;
}

.logout-btn:hover { background: rgba(255,255,255,0.08); }

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.5);
  z-index: 290;
}

.hamburger-btn {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  flex-direction: column;
  gap: 4px;
  padding: 6px;
}

.hamburger-btn span { width: 22px; height: 2px; background: var(--black); display: block; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .hamburger-btn { display: flex; }
}

/* Main */
.main-content {
  flex: 1;
  margin-left: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

@media (max-width: 900px) {
  .main-content { margin-left: 0; }
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  padding: 18px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  justify-content: space-between;
}

.topbar-left { display: flex; align-items: center; gap: 14px; }

.topbar h1 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; }

.view-store-link { font-size: 0.85rem; color: var(--black); text-decoration: none; white-space: nowrap; }

.view-store-link:hover { text-decoration: underline; }

.content-area { padding: 32px; }

@media (max-width: 640px) {
  .topbar { padding: 14px 16px; }
  .content-area { padding: 20px 16px; }
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Stat cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  padding: 20px 22px;
}

.stat-card .stat-value { font-family: var(--font-display); font-size: 2rem; font-weight: 700; }

.stat-card .stat-label { font-size: 0.8rem; color: var(--gray-600); margin-top: 4px; }

/* Section header */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}

.section-header h2 { font-family: var(--font-display); font-size: 1.3rem; }

.btn-primary {
  background: var(--black);
  color: var(--white);
  border: none;
  padding: 11px 20px;
  font-size: 0.85rem;
  cursor: pointer;
  white-space: nowrap;
}

/* Table */
.table-wrap {
  background: var(--white);
  border: 1px solid var(--gray-200);
  overflow-x: auto;
}

table { width: 100%; border-collapse: collapse; min-width: 760px; }

th, td {
  text-align: left;
  padding: 12px 16px;
  border-bottom: 1px solid var(--gray-200);
  font-size: 0.85rem;
  white-space: nowrap;
}

th { color: var(--gray-600); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; background: var(--gray-100); }

tbody tr:last-child td { border-bottom: none; }

.table-img {
  width: 44px;
  height: 44px;
  object-fit: cover;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
}

.table-img img { width: 100%; height: 100%; object-fit: cover; }

.stock-controls { display: flex; align-items: center; gap: 8px; }

.stock-controls button {
  width: 24px;
  height: 24px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  cursor: pointer;
  font-size: 0.9rem;
  line-height: 1;
}

.tags-cell { display: flex; gap: 4px; flex-wrap: wrap; max-width: 180px; white-space: normal; }

.tags-cell span { font-size: 0.7rem; background: var(--gray-100); padding: 2px 8px; }

.status-badge { padding: 4px 10px; font-size: 0.72rem; font-weight: 600; display: inline-block; }

.status-badge.ok { background: var(--success-bg); color: var(--success); }
.status-badge.low { background: var(--warning-bg); color: var(--warning); }
.status-badge.out { background: var(--danger-bg); color: var(--danger); }

.action-btn {
  background: none;
  border: 1px solid var(--gray-200);
  padding: 6px 12px;
  font-size: 0.78rem;
  cursor: pointer;
  margin-right: 6px;
}

.action-btn.danger { color: var(--danger); border-color: var(--danger-bg); }

/* Collections grid */
.collections-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}

.collection-card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.collection-card h3 { font-family: var(--font-display); font-size: 1.15rem; }

.collection-card .count { font-size: 0.82rem; color: var(--gray-600); }

.collection-card .card-actions { margin-top: 8px; display: flex; gap: 8px; }

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 20px;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--white);
  width: 100%;
  max-width: 680px;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  padding: 32px;
}

@media (max-width: 640px) {
  .modal { padding: 24px 18px; }
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 16px;
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
}

.modal h2 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 22px; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
}

.form-grid .full-width { grid-column: 1 / -1; }

.form-group { display: flex; flex-direction: column; gap: 6px; }

.form-group label { font-size: 0.8rem; font-weight: 600; }

.form-group input,
.form-group select,
.form-group textarea {
  border: 1px solid var(--gray-200);
  padding: 10px 12px;
  font-size: 0.88rem;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
  font-family: var(--font-body);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { outline: none; border-color: var(--black); }

.image-preview {
  margin-top: 8px;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 160px;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.image-preview img { width: 100%; height: 100%; object-fit: cover; }

.modal-actions {
  margin-top: 24px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.btn-secondary {
  background: var(--white);
  border: 1px solid var(--gray-200);
  padding: 11px 20px;
  font-size: 0.85rem;
  cursor: pointer;
}

/* Toast */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 900;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  background: var(--black);
  color: var(--white);
  padding: 15px 22px;
  font-size: 0.85rem;
  min-width: 220px;
  animation: toast-in 0.3s ease;
}

.toast.error { background: var(--danger); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .toast-container { left: 16px; right: 16px; bottom: 16px; }
  .toast { min-width: 0; }
}

.empty-row td { text-align: center; color: var(--gray-600); padding: 32px 16px; }
</style>
</head>
<body>

<div class="app-layout">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Yukly Store</div>
    <nav class="sidebar-nav">
      <button class="sidebar-nav-item active" data-tab="productos">Productos</button>
      <button class="sidebar-nav-item" data-tab="colecciones">Colecciones</button>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger-btn" id="hamburger-btn"><span></span><span></span><span></span></button>
        <h1 id="topbar-title">Productos</h1>
      </div>
      <a class="view-store-link" href="index.html" target="_blank" rel="noopener">Ver tienda →</a>
    </div>

    <div class="content-area">
      <section class="tab-panel active" id="tab-productos">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="stat-total-products">0</div>
            <div class="stat-label">Total de productos</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-total-collections">0</div>
            <div class="stat-label">Total de colecciones</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-out-of-stock">0</div>
            <div class="stat-label">Productos agotados</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-low-stock">0</div>
            <div class="stat-label">Stock bajo</div>
          </div>
        </div>

        <div class="section-header">
          <h2>Productos</h2>
          <button class="btn-primary" id="new-product-btn">+ Nuevo producto</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Colección</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Marca</th>
                <th>Etiquetas</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="products-table-body"></tbody>
          </table>
        </div>
      </section>

      <section class="tab-panel" id="tab-colecciones">
        <div class="section-header">
          <h2>Colecciones</h2>
          <button class="btn-primary" id="new-collection-btn">+ Nueva colección</button>
        </div>
        <div class="collections-grid" id="collections-grid"></div>
      </section>
    </div>
  </div>
</div>

<!-- Product modal -->
<div class="modal-overlay" id="product-modal-overlay">
  <div class="modal">
    <button class="modal-close" id="product-modal-close">&times;</button>
    <h2 id="product-modal-title">Nuevo producto</h2>
    <form id="product-form">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="p-name">Nombre *</label>
          <input type="text" id="p-name" required>
        </div>
        <div class="form-group">
          <label for="p-price">Precio (MXN) *</label>
          <input type="number" id="p-price" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="p-stock">Stock *</label>
          <input type="number" id="p-stock" min="0" step="1" required>
        </div>
        <div class="form-group">
          <label for="p-collection">Colección *</label>
          <select id="p-collection" required></select>
        </div>
        <div class="form-group">
          <label for="p-brand">Marca</label>
          <input type="text" id="p-brand">
        </div>
        <div class="form-group full-width">
          <label for="p-tags">Etiquetas (separadas por coma)</label>
          <input type="text" id="p-tags" placeholder="anime, kawaii">
        </div>
        <div class="form-group full-width">
          <label for="p-description">Descripción</label>
          <textarea id="p-description" rows="3"></textarea>
        </div>
        <div class="form-group full-width">
          <label for="p-image">URL de imagen</label>
          <input type="url" id="p-image" placeholder="https://...">
          <div class="image-preview" id="p-image-preview">
            <span>🧸</span>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="product-cancel-btn">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Collection modal -->
<div class="modal-overlay" id="collection-modal-overlay">
  <div class="modal">
    <button class="modal-close" id="collection-modal-close">&times;</button>
    <h2 id="collection-modal-title">Nueva colección</h2>
    <form id="collection-form">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="c-name">Nombre *</label>
          <input type="text" id="c-name" required>
        </div>
        <div class="form-group full-width">
          <label for="c-description">Descripción</label>
          <textarea id="c-description" rows="3"></textarea>
        </div>
        <div class="form-group full-width">
          <label for="c-image">URL de imagen de portada</label>
          <input type="url" id="c-image" placeholder="https://...">
          <div class="image-preview" id="c-image-preview">
            <span>🖼️</span>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="collection-cancel-btn">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE_BUCKET",
  messagingSenderId: "TU_MESSAGING_SENDER_ID",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "admin-login.html";
  }
});

let productsData = [];
let collectionsData = [];
let editingProductId = null;
let editingCollectionId = null;

const els = {
  sidebar: document.getElementById("sidebar"),
  sidebarOverlay: document.getElementById("sidebar-overlay"),
  hamburgerBtn: document.getElementById("hamburger-btn"),
  navItems: document.querySelectorAll(".sidebar-nav-item"),
  topbarTitle: document.getElementById("topbar-title"),
  tabProductos: document.getElementById("tab-productos"),
  tabColecciones: document.getElementById("tab-colecciones"),
  logoutBtn: document.getElementById("logout-btn"),

  statTotalProducts: document.getElementById("stat-total-products"),
  statTotalCollections: document.getElementById("stat-total-collections"),
  statOutOfStock: document.getElementById("stat-out-of-stock"),
  statLowStock: document.getElementById("stat-low-stock"),

  productsTableBody: document.getElementById("products-table-body"),
  collectionsGrid: document.getElementById("collections-grid"),

  newProductBtn: document.getElementById("new-product-btn"),
  newCollectionBtn: document.getElementById("new-collection-btn"),

  productModalOverlay: document.getElementById("product-modal-overlay"),
  productModalClose: document.getElementById("product-modal-close"),
  productModalTitle: document.getElementById("product-modal-title"),
  productForm: document.getElementById("product-form"),
  productCancelBtn: document.getElementById("product-cancel-btn"),
  pName: document.getElementById("p-name"),
  pPrice: document.getElementById("p-price"),
  pStock: document.getElementById("p-stock"),
  pCollection: document.getElementById("p-collection"),
  pBrand: document.getElementById("p-brand"),
  pTags: document.getElementById("p-tags"),
  pDescription: document.getElementById("p-description"),
  pImage: document.getElementById("p-image"),
  pImagePreview: document.getElementById("p-image-preview"),

  collectionModalOverlay: document.getElementById("collection-modal-overlay"),
  collectionModalClose: document.getElementById("collection-modal-close"),
  collectionModalTitle: document.getElementById("collection-modal-title"),
  collectionForm: document.getElementById("collection-form"),
  collectionCancelBtn: document.getElementById("collection-cancel-btn"),
  cName: document.getElementById("c-name"),
  cDescription: document.getElementById("c-description"),
  cImage: document.getElementById("c-image"),
  cImagePreview: document.getElementById("c-image-preview"),

  toastContainer: document.getElementById("toast-container")
};

function showToast(msg, type) {
  const toast = document.createElement("div");
  toast.className = "toast" + (type === "error" ? " error" : "");
  toast.textContent = msg;
  els.toastContainer.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function formatPrice(n) {
  return "$" + Number(n).toLocaleString("es-MX", { maximumFractionDigits: 0 });
}

/* Sidebar / tabs */
function openSidebar() {
  els.sidebar.classList.add("open");
  els.sidebarOverlay.classList.add("open");
}
function closeSidebar() {
  els.sidebar.classList.remove("open");
  els.sidebarOverlay.classList.remove("open");
}
els.hamburgerBtn.onclick = openSidebar;
els.sidebarOverlay.onclick = closeSidebar;

els.navItems.forEach((btn) => {
  btn.addEventListener("click", () => {
    els.navItems.forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    els.tabProductos.classList.toggle("active", tab === "productos");
    els.tabColecciones.classList.toggle("active", tab === "colecciones");
    els.topbarTitle.textContent = tab === "productos" ? "Productos" : "Colecciones";
    closeSidebar();
  });
});

els.logoutBtn.onclick = async () => {
  await signOut(auth);
  window.location.href = "admin-login.html";
};

/* Collection lookup */
function collectionById(id) {
  return collectionsData.find((c) => c.id === id);
}

function populateCollectionSelect() {
  const current = els.pCollection.value;
  els.pCollection.innerHTML = "";
  collectionsData.forEach((c) => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    els.pCollection.appendChild(opt);
  });
  if (current) els.pCollection.value = current;
}

/* Stats */
function renderStats() {
  els.statTotalProducts.textContent = productsData.length;
  els.statTotalCollections.textContent = collectionsData.length;
  els.statOutOfStock.textContent = productsData.filter((p) => (Number(p.stock) || 0) === 0).length;
  els.statLowStock.textContent = productsData.filter((p) => {
    const s = Number(p.stock) || 0;
    return s > 0 && s <= 5;
  }).length;
}

/* Products table */
function renderProductsTable() {
  els.productsTableBody.innerHTML = "";

  if (productsData.length === 0) {
    const tr = document.createElement("tr");
    tr.className = "empty-row";
    tr.innerHTML = '<td colspan="9">No hay productos registrados.</td>';
    els.productsTableBody.appendChild(tr);
    return;
  }

  productsData.forEach((product) => {
    const tr = document.createElement("tr");
    const stock = Number(product.stock) || 0;
    const coll = collectionById(product.collectionId);

    const imgTd = document.createElement("td");
    const imgBox = document.createElement("div");
    imgBox.className = "table-img";
    if (product.image) {
      const img = document.createElement("img");
      img.src = product.image;
      img.alt = "";
      img.onerror = () => { img.remove(); imgBox.textContent = "📦"; };
      imgBox.appendChild(img);
    } else {
      imgBox.textContent = "📦";
    }
    imgTd.appendChild(imgBox);
    tr.appendChild(imgTd);

    const nameTd = document.createElement("td");
    nameTd.textContent = product.name;
    tr.appendChild(nameTd);

    const collTd = document.createElement("td");
    collTd.textContent = coll ? coll.name : "—";
    tr.appendChild(collTd);

    const priceTd = document.createElement("td");
    priceTd.textContent = formatPrice(product.price);
    tr.appendChild(priceTd);

    const stockTd = document.createElement("td");
    const stockControls = document.createElement("div");
    stockControls.className = "stock-controls";
    const minusBtn = document.createElement("button");
    minusBtn.type = "button";
    minusBtn.textContent = "−";
    minusBtn.onclick = () => adjustStock(product, -1);
    const stockSpan = document.createElement("span");
    stockSpan.textContent = stock;
    const plusBtn = document.createElement("button");
    plusBtn.type = "button";
    plusBtn.textContent = "+";
    plusBtn.onclick = () => adjustStock(product, 1);
    stockControls.appendChild(minusBtn);
    stockControls.appendChild(stockSpan);
    stockControls.appendChild(plusBtn);
    stockTd.appendChild(stockControls);
    tr.appendChild(stockTd);

    const brandTd = document.createElement("td");
    brandTd.textContent = product.brand || "—";
    tr.appendChild(brandTd);

    const tagsTd = document.createElement("td");
    const tagsWrap = document.createElement("div");
    tagsWrap.className = "tags-cell";
    (product.tags || []).forEach((t) => {
      const span = document.createElement("span");
      span.textContent = t;
      tagsWrap.appendChild(span);
    });
    tagsTd.appendChild(tagsWrap);
    tr.appendChild(tagsTd);

    const statusTd = document.createElement("td");
    const badge = document.createElement("span");
    if (stock === 0) {
      badge.className = "status-badge out";
      badge.textContent = "Agotado";
    } else if (stock <= 5) {
      badge.className = "status-badge low";
      badge.textContent = "Stock bajo";
    } else {
      badge.className = "status-badge ok";
      badge.textContent = "Disponible";
    }
    statusTd.appendChild(badge);
    tr.appendChild(statusTd);

    const actionsTd = document.createElement("td");
    const editBtn = document.createElement("button");
    editBtn.className = "action-btn";
    editBtn.textContent = "Editar";
    editBtn.onclick = () => openProductModal(product);
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "action-btn danger";
    deleteBtn.textContent = "Eliminar";
    deleteBtn.onclick = () => deleteProduct(product);
    actionsTd.appendChild(editBtn);
    actionsTd.appendChild(deleteBtn);
    tr.appendChild(actionsTd);

    els.productsTableBody.appendChild(tr);
  });
}

async function adjustStock(product, delta) {
  const current = Number(product.stock) || 0;
  const next = Math.max(0, current + delta);
  try {
    await updateDoc(doc(db, "products", product.id), { stock: next });
  } catch (e) {
    showToast("No se pudo actualizar el stock.", "error");
  }
}

async function deleteProduct(product) {
  if (!confirm("¿Eliminar el producto \"" + product.name + "\"? Esta acción no se puede deshacer.")) return;
  try {
    await deleteDoc(doc(db, "products", product.id));
    showToast("Producto eliminado.");
  } catch (e) {
    showToast("No se pudo eliminar el producto.", "error");
  }
}

/* Collections grid */
function renderCollectionsGrid() {
  els.collectionsGrid.innerHTML = "";

  if (collectionsData.length === 0) {
    const empty = document.createElement("p");
    empty.textContent = "No hay colecciones registradas.";
    els.collectionsGrid.appendChild(empty);
    return;
  }

  collectionsData.forEach((coll) => {
    const count = productsData.filter((p) => p.collectionId === coll.id).length;

    const card = document.createElement("div");
    card.className = "collection-card";

    const name = document.createElement("h3");
    name.textContent = coll.name;
    card.appendChild(name);

    const countLine = document.createElement("span");
    countLine.className = "count";
    countLine.textContent = count + (count === 1 ? " producto asignado" : " productos asignados");
    card.appendChild(countLine);

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const editBtn = document.createElement("button");
    editBtn.className = "action-btn";
    editBtn.textContent = "Editar";
    editBtn.onclick = () => openCollectionModal(coll);
    actions.appendChild(editBtn);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "action-btn danger";
    deleteBtn.textContent = "Eliminar";
    deleteBtn.onclick = () => deleteCollection(coll, count);
    actions.appendChild(deleteBtn);

    card.appendChild(actions);
    els.collectionsGrid.appendChild(card);
  });
}

async function deleteCollection(coll, count) {
  if (count > 0) {
    showToast("No puedes eliminar una colección con productos asignados.", "error");
    return;
  }
  if (!confirm("¿Eliminar la colección \"" + coll.name + "\"?")) return;
  try {
    await deleteDoc(doc(db, "collections", coll.id));
    showToast("Colección eliminada.");
  } catch (e) {
    showToast("No se pudo eliminar la colección.", "error");
  }
}

/* Product modal */
function openProductModal(product) {
  editingProductId = product ? product.id : null;
  els.productModalTitle.textContent = product ? "Editar producto" : "Nuevo producto";
  populateCollectionSelect();

  els.pName.value = product ? product.name || "" : "";
  els.pPrice.value = product ? product.price ?? "" : "";
  els.pStock.value = product ? product.stock ?? "" : "";
  els.pCollection.value = product ? product.collectionId || "" : (collectionsData[0] ? collectionsData[0].id : "");
  els.pBrand.value = product ? product.brand || "" : "";
  els.pTags.value = product && product.tags ? product.tags.join(", ") : "";
  els.pDescription.value = product ? product.description || "" : "";
  els.pImage.value = product ? product.image || "" : "";
  updateImagePreview(els.pImage.value, els.pImagePreview, "🧸");

  els.productModalOverlay.classList.add("open");
}

function closeProductModal() {
  els.productModalOverlay.classList.remove("open");
  els.productForm.reset();
  editingProductId = null;
}

function updateImagePreview(url, container, fallbackEmoji) {
  container.innerHTML = "";
  if (!url) {
    container.innerHTML = "<span>" + fallbackEmoji + "</span>";
    return;
  }
  const img = document.createElement("img");
  img.src = url;
  img.alt = "";
  img.onerror = () => {
    container.innerHTML = "<span>" + fallbackEmoji + "</span>";
  };
  container.appendChild(img);
}

els.pImage.addEventListener("input", () => updateImagePreview(els.pImage.value, els.pImagePreview, "🧸"));

els.newProductBtn.onclick = () => openProductModal(null);
els.productModalClose.onclick = closeProductModal;
els.productCancelBtn.onclick = closeProductModal;
els.productModalOverlay.addEventListener("click", (e) => {
  if (e.target === els.productModalOverlay) closeProductModal();
});

els.productForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {
    name: els.pName.value.trim(),
    price: Number(els.pPrice.value) || 0,
    stock: Number(els.pStock.value) || 0,
    collectionId: els.pCollection.value,
    brand: els.pBrand.value.trim(),
    tags: els.pTags.value.split(",").map((t) => t.trim()).filter(Boolean),
    description: els.pDescription.value.trim(),
    image: els.pImage.value.trim()
  };

  try {
    if (editingProductId) {
      await updateDoc(doc(db, "products", editingProductId), data);
      showToast("Producto actualizado.");
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "products"), data);
      showToast("Producto creado.");
    }
    closeProductModal();
  } catch (err) {
    showToast("No se pudo guardar el producto.", "error");
  }
});

/* Collection modal */
function openCollectionModal(coll) {
  editingCollectionId = coll ? coll.id : null;
  els.collectionModalTitle.textContent = coll ? "Editar colección" : "Nueva colección";

  els.cName.value = coll ? coll.name || "" : "";
  els.cDescription.value = coll ? coll.description || "" : "";
  els.cImage.value = coll ? coll.image || "" : "";
  updateImagePreview(els.cImage.value, els.cImagePreview, "🖼️");

  els.collectionModalOverlay.classList.add("open");
}

function closeCollectionModal() {
  els.collectionModalOverlay.classList.remove("open");
  els.collectionForm.reset();
  editingCollectionId = null;
}

els.cImage.addEventListener("input", () => updateImagePreview(els.cImage.value, els.cImagePreview, "🖼️"));

els.newCollectionBtn.onclick = () => openCollectionModal(null);
els.collectionModalClose.onclick = closeCollectionModal;
els.collectionCancelBtn.onclick = closeCollectionModal;
els.collectionModalOverlay.addEventListener("click", (e) => {
  if (e.target === els.collectionModalOverlay) closeCollectionModal();
});

els.collectionForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {
    name: els.cName.value.trim(),
    description: els.cDescription.value.trim(),
    image: els.cImage.value.trim()
  };

  try {
    if (editingCollectionId) {
      await updateDoc(doc(db, "collections", editingCollectionId), data);
      showToast("Colección actualizada.");
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "collections"), data);
      showToast("Colección creada.");
    }
    closeCollectionModal();
  } catch (err) {
    showToast("No se pudo guardar la colección.", "error");
  }
});

/* Realtime listeners */
onSnapshot(collection(db, "collections"), (snap) => {
  collectionsData = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  populateCollectionSelect();
  renderStats();
  renderCollectionsGrid();
  renderProductsTable();
});

onSnapshot(collection(db, "products"), (snap) => {
  productsData = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  renderStats();
  renderProductsTable();
  renderCollectionsGrid();
});
</script>
</body>
</html>
