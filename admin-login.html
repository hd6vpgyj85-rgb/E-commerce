<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yukly Store — Panel administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --black: #0a0a0a;
  --lavender: #c4b5d6;
  --gray-100: #f5f5f5;
  --gray-200: #e5e5e5;
  --gray-600: #525252;
  --danger: #dc2626;
  --danger-bg: #fdecec;
  --warning: #b45309;
  --warning-bg: #fef3c7;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  color: var(--black);
  background: var(--white);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.logo-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--black);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
}

.panel-label {
  font-size: 0.8rem;
  color: var(--gray-600);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.login-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.form-group { display: flex; flex-direction: column; gap: 7px; }

.form-group label { font-size: 0.8rem; font-weight: 600; }

.form-group input {
  border: 1px solid var(--gray-200);
  padding: 12px 14px;
  font-size: 0.92rem;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
  font-family: var(--font-body);
}

.form-group input:focus { outline: none; border-color: var(--black); }

.login-btn {
  margin-top: 6px;
  background: var(--black);
  color: var(--white);
  border: none;
  padding: 14px;
  font-size: 0.9rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}

.login-btn:disabled { background: var(--gray-200); color: var(--gray-600); cursor: not-allowed; }

.error-message {
  display: none;
  font-size: 0.85rem;
  padding: 12px 14px;
  border-left: 3px solid var(--danger);
  background: var(--danger-bg);
  color: var(--danger);
}

.error-message.show { display: block; }

.error-message.warning {
  border-left-color: var(--warning);
  background: var(--warning-bg);
  color: var(--warning);
}

.back-link {
  margin-top: 28px;
  font-size: 0.85rem;
  color: var(--gray-600);
  text-decoration: none;
}

.back-link:hover { color: var(--black); }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-circle">Y</div>
  <div class="brand-name">Yukly Store</div>
  <div class="panel-label">Panel administrativo</div>

  <form class="login-form" id="login-form">
    <div class="error-message" id="error-message"></div>
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn" id="login-btn">Ingresar</button>
  </form>

  <a class="back-link" href="index.html">← Volver a la tienda</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE_BUCKET",
  messagingSenderId: "TU_MESSAGING_SENDER_ID",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("login-form");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("login-btn");
const errorMessage = document.getElementById("error-message");

onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = "admin.html";
  }
});

function showError(text, warning) {
  errorMessage.textContent = text;
  errorMessage.classList.toggle("warning", !!warning);
  errorMessage.classList.add("show");
}

function hideError() {
  errorMessage.classList.remove("show");
}

async function doLogin() {
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  if (!email || !password) return;

  hideError();
  loginBtn.disabled = true;
  loginBtn.textContent = "Ingresando...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    const code = err && err.code ? err.code : "";
    if (code === "auth/too-many-requests") {
      showError("Demasiados intentos fallidos. Intenta más tarde.", true);
    } else if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
      showError("Correo o contraseña incorrectos.");
    } else if (code === "auth/invalid-email") {
      showError("El correo electrónico no es válido.");
    } else if (code === "auth/network-request-failed") {
      showError("Error de conexión. Verifica tu internet.", true);
    } else {
      showError("No se pudo iniciar sesión. Intenta de nuevo.");
    }
    loginBtn.disabled = false;
    loginBtn.textContent = "Ingresar";
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  doLogin();
});

passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    doLogin();
  }
});
</script>
</body>
</html>
